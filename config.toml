# Pins Streamlit's own base theme so it's deterministic across every
# environment (localhost, every deployment target, every visitor's OS/
# browser dark-or-light preference). Without this file, Streamlit falls
# back to auto-detecting the viewer's system color scheme for its native
# theme layer — the app's own Light/Dark Mode toggle (in styles.py/app.py)
# then layers custom CSS on top of that, but a handful of native Streamlit
# elements aren't fully covered by !important overrides, so whatever
# Streamlit's own baseline happens to be can show through inconsistently
# between environments. This file removes that variable entirely.
#
# Values below mirror the app's light-mode palette (see the `palette`
# block in styles.py) so Streamlit's own baseline and the custom CSS
# agree from the very first paint, before any session-state toggle runs.

[theme]
base = "light"
primaryColor = "#5b7a52"
backgroundColor = "#f8f5ef"
secondaryBackgroundColor = "#f1ece1"
textColor = "#262620"
font = "sans serif"

[server]
# Avoids Streamlit's local-dev file-watcher / dev-only behaviors running
# in production, so the deployed process behaves consistently rather than
# picking up the auto-reload / dev-mode code paths.
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
